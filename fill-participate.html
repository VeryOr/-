<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>참여 기록 | 경험 채우기</title><link rel="stylesheet" href="css/fill.css"></head><body><div class="shell"><div id="header"></div><h1 class="page-title">참여 기록</h1><div class="notice" id="contestName"></div><form class="form-card" id="recordForm"><div class="field"><label for="result">결과</label><select id="result" required><option value="">선택하세요</option><option>수상</option><option>입선</option><option>미수상</option><option>진행 중</option></select></div><div class="field"><label for="role">내 역할</label><input id="role" required placeholder="예: 기획과 발표를 맡았어요"></div><div class="field"><label for="learned">무엇을 배웠나요?</label><textarea id="learned" rows="4" required></textarea></div><div class="field"><label for="next">다음엔 뭘 다르게 할까요?</label><textarea id="next" rows="4" required></textarea></div><div class="field"><label>역량 태그 (필수)</label><div class="tag-options" id="tagOptions"></div></div><button class="primary-btn" type="submit">기록 저장</button></form><section class="form-card" id="saved" style="display:none;margin-top:16px" aria-live="polite"><strong>기록에 추가했어요</strong><p id="matchText"></p><a class="primary-btn" id="portfolioLink" href="#">포트폴리오로 보내기</a></section></div>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script><script src="data/jobs.js"></script><script src="data/contests.js"></script><script src="common/storage.js"></script><script src="common/recommend.js"></script><script src="common/job-match.js"></script><script src="js/fill-header.js"></script><script src="js/fill-participate.js"></script></body></html>
